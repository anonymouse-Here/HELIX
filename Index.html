<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#070F1A;
    color:white;
    overflow-x:hidden;
}

/* LANDING */
#landing{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:0.6s;
}

.logo{
    font-size:52px;
    font-weight:bold;
    letter-spacing:2px;
    margin-top:10px;
}

/* DNA ICON */
.dna{
    width:50px;
    height:50px;
    position:relative;
    margin-bottom:10px;
}

.dna:before,
.dna:after{
    content:"";
    position:absolute;
    width:2px;
    height:50px;
    background:linear-gradient(#4cc9f0,#4361ee);
    left:50%;
    transform:translateX(-50%) rotate(45deg);
}

.dna:after{
    transform:translateX(-50%) rotate(-45deg);
}

/* TAGLINE */
.tagline{
    opacity:0.8;
    margin-top:8px;
}

/* BUTTON */
button{
    margin-top:25px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* HOME */
#home{
    display:none;
    padding:20px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-top:20px;
}

/* SQUARE CARD */
.card{
    background:#0E2A44;
    padding:20px;
    border-radius:14px;
    cursor:pointer;
    text-align:center;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.05);
    background:#14507A;
}

/* MODAL */
#modal{
    position:fixed;
    inset:0;
    background:#000000cc;
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:white;
    color:black;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:400px;
}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing">
    <div class="dna"></div>
    <div class="logo">Helix</div>
    <div class="tagline">Research made accessible</div>

    <button onclick="enterSite()">Explore</button>
</div>

<!-- HOME -->
<div id="home">

    <h2 style="text-align:center;">Discover Opportunities</h2>

    <div class="grid" id="grid"></div>

</div>

<!-- MODAL -->
<div id="modal" onclick="closeModal()">
    <div class="modal-box" id="modalBox"></div>
</div>

<script>

const data = [
{
title:"RSI (MIT)",
type:"Summer Program",
desc:"Elite research program for high school students.",
location:"MIT Campus",
grade:"High School",
deadline:"Winter",
apply:"Essay + recommendations",
link:"https://example.com"
},
{
title:"NASA Internship",
type:"Internship",
desc:"Work on real space research projects.",
location:"NASA Centers",
grade:"HS / College",
deadline:"Varies",
apply:"Resume + application",
link:"https://nasa.gov"
},
{
title:"ISEF",
type:"Competition",
desc:"Global science fair for student researchers.",
location:"Global",
grade:"High School",
deadline:"Spring",
apply:"Regional qualification",
link:"https://example.com"
},
{
title:"Polygence",
type:"Virtual",
desc:"1-on-1 online research mentorship.",
location:"Online",
grade:"High School",
deadline:"Rolling",
apply:"Short application",
link:"https://polygence.org"
}
];

function enterSite(){
    document.getElementById("landing").style.display="none";
    document.getElementById("home").style.display="block";
    render();
}

function render(){
    const grid = document.getElementById("grid");
    grid.innerHTML="";

    data.forEach((o,i)=>{
        grid.innerHTML += `
        <div class="card" onclick="openModal(${i})">
            <b>${o.title}</b><br>
            <small>${o.type}</small>
        </div>
        `;
    });
}

function openModal(i){
    const o = data[i];

    document.getElementById("modalBox").innerHTML=`
        <h2>${o.title}</h2>
        <p>${o.desc}</p>

        <p><b>Location:</b> ${o.location}</p>
        <p><b>Grade:</b> ${o.grade}</p>
        <p><b>Deadline:</b> ${o.deadline}</p>
        <p><b>Apply:</b> ${o.apply}</p>

        <a href="${o.link}" target="_blank">Open Link</a>
    `;

    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
