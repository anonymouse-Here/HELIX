<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Helix</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #0B1320;
    color: #F5F7FA;
}

/* HEADER */
header {
    text-align: center;
    padding: 50px 20px 20px;
}

h1 {
    font-size: 52px;
    margin: 0;
    color: #2DE2E6;
    letter-spacing: 2px;
}

.subtitle {
    opacity: 0.8;
    margin-top: 10px;
}

/* SEARCH */
.search-box {
    margin: 25px auto;
    max-width: 650px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
}

/* FILTERS */
.filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

select {
    padding: 10px;
    border-radius: 8px;
    border: none;
}

/* GRID */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 40px;
    max-width: 1100px;
    margin: auto;
}

/* CARD */
.card {
    background: #121C2E;
    padding: 18px;
    border-radius: 12px;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    background: #16233A;
}

.badge {
    color: #2DE2E6;
    font-size: 12px;
    margin-bottom: 8px;
}

.title {
    font-size: 18px;
    font-weight: 600;
}

.meta {
    font-size: 13px;
    opacity: 0.8;
    margin: 6px 0;
}

.tip {
    margin-top: 10px;
    font-size: 13px;
    background: rgba(45,226,230,0.08);
    padding: 8px;
    border-radius: 8px;
}

.button {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    background: #2DE2E6;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h1>Helix</h1>
    <div class="subtitle">Discover research, competitions, and opportunities</div>

    <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search opportunities...">
    </div>

    <div class="filters">
        <select id="gradeFilter">
            <option value="all">Grade Level</option>
            <option value="high">High School</option>
            <option value="undergrad">Undergraduate</option>
        </select>

        <select id="fieldFilter">
            <option value="all">Field</option>
            <option value="bio">Biology</option>
            <option value="cs">Computer Science</option>
            <option value="math">Math</option>
        </select>

        <select id="typeFilter">
            <option value="all">Type</option>
            <option value="research">Research</option>
            <option value="competition">Competition</option>
            <option value="program">Program</option>
        </select>
    </div>
</header>

<div class="container" id="cards"></div>

<script>
const opportunities = [
{
    title: "RISE Program",
    field: "bio",
    grade: "high",
    type: "program",
    location: "In Person",
    deadline: "Varies",
    desc: "Summer research program for high school students in STEM fields.",
    tip: "Strong essays showing curiosity and motivation matter more than grades."
},
{
    title: "RSI",
    field: "math",
    grade: "high",
    type: "research",
    location: "In Person",
    deadline: "Winter",
    desc: "One of the most prestigious summer research programs in the world.",
    tip: "Start early prep; recommendation letters are crucial."
},
{
    title: "ISEF",
    field: "cs",
    grade: "high",
    type: "competition",
    location: "Global",
    deadline: "Spring",
    desc: "International science and engineering fair.",
    tip: "Unique, testable projects with clear data win."
},
{
    title: "Breakthrough Junior Challenge",
    field: "bio",
    grade: "high",
    type: "competition",
    location: "Online",
    deadline: "Fall",
    desc: "Create a short science video explaining a concept.",
    tip: "Clarity and creativity matter more than complexity."
}
];

const container = document.getElementById("cards");

function render(list) {
    container.innerHTML = "";
    list.forEach(o => {
        container.innerHTML += `
        <div class="card">
            <div class="badge">${o.type.toUpperCase()} • ${o.field.toUpperCase()}</div>
            <div class="title">${o.title}</div>
            <div class="meta">${o.location} • Deadline: ${o.deadline}</div>
            <div class="meta">${o.desc}</div>
            <div class="tip">⭐ ${o.tip}</div>
            <button class="button">View Details</button>
        </div>
        `;
    });
}

render(opportunities);

// SEARCH + FILTER
function filter() {
    let text = document.getElementById("searchInput").value.toLowerCase();
    let grade = document.getElementById("gradeFilter").value;
    let field = document.getElementById("fieldFilter").value;
    let type = document.getElementById("typeFilter").value;

    let filtered = opportunities.filter(o => {
        return (
            (o.title.toLowerCase().includes(text)) &&
            (grade === "all" || o.grade === grade) &&
            (field === "all" || o.field === field) &&
            (type === "all" || o.type === type)
        );
    });

    render(filtered);
}

document.getElementById("searchInput").addEventListener("input", filter);
document.getElementById("gradeFilter").addEventListener("change", filter);
document.getElementById("fieldFilter").addEventListener("change", filter);
document.getElementById("typeFilter").addEventListener("change", filter);
</script>

</body>
</html>
