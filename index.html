<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix 6.0</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#060D18;
    color:white;
}

/* HEADER */
header{
    text-align:center;
    padding:35px 20px;
}

h1{
    font-size:52px;
    margin:0;
}

/* SEARCH */
input{
    width:90%;
    max-width:600px;
    padding:12px;
    border-radius:12px;
    border:none;
    display:block;
    margin:10px auto;
}

/* GRID */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
    padding:20px;
    max-width:1100px;
    margin:auto;
}

/* CARD */
.card{
    background:#0E2A44;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
}

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
}

.card-content{
    padding:12px;
}

/* BADGES */
.badge{
    font-size:11px;
    opacity:0.7;
}

/* MODAL */
#modal{
    position:fixed;
    inset:0;
    background:#000000cc;
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:white;
    color:black;
    padding:18px;
    border-radius:12px;
    max-width:450px;
    width:90%;
}
</style>
</head>

<body>

<header>
    <h1>HELIX 6.0</h1>
    <p>Discover. Apply. Build your future.</p>
</header>

<input id="search" placeholder="Search biology, CS, math..." oninput="render()">

<div class="container" id="list"></div>

<div id="modal" onclick="closeModal()">
    <div class="modal-box" id="modalBox"></div>
</div>

<script>

const data = [
{
title:"RSI (MIT)",
type:"summer",
subject:"biology",
grade:"High School",
location:"MIT Campus",
difficulty:"Advanced",
deadline:"Winter",
description:"Elite 6-week research program at MIT.",
requirements:"Strong academics, essays, recommendations",
tips:"Show curiosity + specific research interests in essays",
link:"https://example.com",
image:"https://images.unsplash.com/photo-1562774053-701939374585"
},

{
title:"NASA Internship",
type:"internship",
subject:"engineering",
grade:"High School / College",
location:"NASA Centers",
difficulty:"Advanced",
deadline:"Varies",
description:"Work on real space research projects.",
requirements:"Resume, essays, STEM background",
tips:"Highlight projects or coding experience",
link:"https://nasa.gov",
image:"https://images.unsplash.com/photo-1454789548928-9efd52dc4031"
},

{
title:"ISEF",
type:"competition",
subject:"science",
grade:"High School",
location:"Global",
difficulty:"Advanced",
deadline:"Spring",
description:"World’s largest science fair.",
requirements:"Research project + regional qualification",
tips:"Originality matters more than complexity",
link:"https://example.com",
image:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158"
}
];

function render(){
    const q = document.getElementById("search").value.toLowerCase();
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.filter(o =>
        o.title.toLowerCase().includes(q) ||
        o.subject.toLowerCase().includes(q) ||
        o.location.toLowerCase().includes(q)
    ).forEach((o,i)=>{
        list.innerHTML += `
        <div class="card" onclick="openModal(${i})">
            <img src="${o.image}">
            <div class="card-content">
                <div class="badge">${o.type.toUpperCase()} • ${o.subject}</div>
                <h3>${o.title}</h3>
                <small>${o.location}</small>
            </div>
        </div>
        `;
    });
}

function openModal(i){
    const o = data[i];

    document.getElementById("modalBox").innerHTML = `
        <h2>${o.title}</h2>
        <p>${o.description}</p>

        <p><b>Location:</b> ${o.location}</p>
        <p><b>Grade:</b> ${o.grade}</p>
        <p><b>Difficulty:</b> ${o.difficulty}</p>
        <p><b>Deadline:</b> ${o.deadline}</p>

        <hr>

        <p><b>Requirements:</b> ${o.requirements}</p>
        <p><b>Tips to get in:</b> ${o.tips}</p>

        <a href="${o.link}" target="_blank">Apply / Learn More</a>
    `;

    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

render();

</script>

</body>
</html>
